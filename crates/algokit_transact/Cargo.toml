[package]
name = "algokit_transact"
version = "0.1.0"
edition = "2024"

[features]
test_utils = [
  "dep:ed25519-dalek",
  "dep:convert_case",
  "dep:algokit_test_artifacts",
]

[dependencies]
base32 = { workspace = true }
base64 = { workspace = true }
convert_case = { workspace = true, optional = true }
derive_builder = { version = "0.20.2" }
ed25519-dalek = { version = "2.1.1", optional = true }
rmp = { workspace = true }
rmp-serde = { workspace = true }
rmpv = { workspace = true }
serde = { workspace = true }
serde_bytes = { workspace = true }
serde_json = { workspace = true }
serde_repr = { workspace = true }
serde_with = { workspace = true }
sha2 = { workspace = true }
snafu = { workspace = true }
algokit_test_artifacts = { path = "../algokit_test_artifacts", optional = true }
async-trait = "0.1.89"
algokit_crypto = { version = "0.1.0", path = "../algokit_crypto" }

[dev-dependencies]
pretty_assertions = { workspace = true }
algokit_transact = { path = '.', features = ["test_utils"] }
tokio = { version = "1.42.0", features = ["macros", "rt"] }
cryptoxide = { workspace = true }
