[package]
name = "algokit_localnet_testing"
version = "0.1.0"
edition = "2024"
description = "Live localnet test support (capturing HTTP client, response-schema validation, KMD fixtures) shared across the generated API client crates"
publish = false

[lib]
name = "algokit_localnet_testing"
path = "src/lib.rs"

[dependencies]
algod_client = { path = "../algod_client" }
kmd_client = { path = "../kmd_client" }
algokit_transact = { path = "../algokit_transact" }
algokit_crypto = { path = "../algokit_crypto" }
algokit_http_client = { path = "../algokit_http_client", default-features = false, features = ["default_client"] }
async-trait = "0.1"
jsonschema = "0.30"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "sync"] }