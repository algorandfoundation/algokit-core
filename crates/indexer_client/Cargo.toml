[package]
name = "indexer_client"
version = "2.0.0"
authors = ["AlgoKit Core Team"]
description = "API client for indexer interaction."
license = "MIT"
edition = "2024"

[features]
default = ["default_client"]
default_client = ["algokit_http_client/default_client"]
ffi_uniffi = ["dep:uniffi", "algokit_http_client/ffi_uniffi", "dep:algokit_transact_ffi"]

[dependencies]
# Core serialization
serde = { workspace = true }
serde_with = { workspace = true }
serde_json = { workspace = true }
serde_repr = { workspace = true }
serde_bytes = { workspace = true }

# HTTP client
algokit_http_client = { path = "../algokit_http_client", features = ["ffi_uniffi"] }
url = "^2.5"

# Uniffi for FFI bindings
uniffi = { workspace = true, optional = true }
algokit_transact_ffi = { optional = true, version = "0.1.0", path = "../algokit_transact_ffi" }


# Error handling
snafu = { workspace = true }

# Utilities
base64 = "^0.22"
uuid = { version = "^1.0", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }
tokio-test = "^0.4"