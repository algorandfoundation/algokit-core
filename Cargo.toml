[workspace]
resolver = "2"
members = [
  "crates/algokit_http_client",
  "crates/algokit_transact",
  "crates/algokit_transact_ffi",
  "crates/algokit_abi",
  "crates/algokit_test_artifacts",
  "crates/ffi_macros",
  "crates/algod_client",
  "crates/indexer_client",
  "crates/kmd_client",
  "tools/build_pkgs",
  "crates/uniffi-bindgen",
  "docs",
  "tools/cargo-bin",
  "tools/api_tools",
  "crates/algokit_crypto",
  "crates/algokit_crypto_ffi",
  "crates/algokit_composer",
  "crates/algokit_composer_ffi",
]

[workspace.dependencies]
uniffi = { version = "0.29.4" }
snafu = { version = "0.8" }
base32 = { version = "0.5.1" }
sha2 = { version = "0.10.8" }
rstest = { version = "0.25.0" }
zeroize = { version = "1.8", features = ["derive"] }
serde = { version = "1.0.216", features = ["derive"] }
serde_with = { version = "3.11.0", default-features = false, features = ["base64", "std", "macros"] }
serde_json = { version = "1.0.133" }
serde_repr = { version = "0.1.20" }
serde_bytes = { version = "0.11.15" }
rmp-serde = { version = "1.3.0" }
rmpv = { version = "1.3.0", features = ["with-serde"] }

[workspace.metadata.bin]
polytest = { version = "0.3.0", locked = true }
cargo-insta = { version = "1.43.1", locked = true }
cargo-nextest = { version = "0.9.100", locked = true }
