name: Swift CI

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build_and_test:
    defaults:
      run:
        shell: bash
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0
          targets: aarch64-apple-ios, x86_64-apple-ios, aarch64-apple-ios-sim, aarch64-apple-ios-macabi, x86_64-apple-ios-macabi, aarch64-apple-darwin, x86_64-apple-darwin

      - name: Build xcframeworks
        run: |
          cargo pkg transact swift
          cargo pkg crypto swift
          cargo pkg composer swift

      # Ideally we'd use a matrix for the platforms, but due to the limitations of Mac runners on GitHub it's probably better to just have a single job with multiple steps
      - name: Detect iOS simulator
        id: ios_sim
        run: |
          DEST_ID="$(python3 - <<'PY'
          import json, subprocess, re

          data = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "-j"],
              text=True
          ))

          def runtime_version(key: str):
              # Example key: com.apple.CoreSimulator.SimRuntime.iOS-18-2
              m = re.search(r"iOS-(\d+)-(\d+)", key)
              return (int(m.group(1)), int(m.group(2))) if m else (-1, -1)

          ios_runtimes = [k for k in data["devices"].keys() if "SimRuntime.iOS-" in k]
          ios_runtimes.sort(key=runtime_version, reverse=True)

          udid = None
          for runtime in ios_runtimes:
              devices = data["devices"][runtime]
              iphones = [d for d in devices if d.get("isAvailable") and d.get("name", "").startswith("iPhone")]
              if iphones:
                  udid = iphones[0]["udid"]
                  break

          if not udid:
              raise SystemExit("No available iPhone simulator found")

          print(udid)
          PY
          )"
          echo "destination=id=${DEST_ID}" >> "$GITHUB_OUTPUT"

      - name: Test (iOS)
        run: cd packages/swift/AlgoKitUtils && xcodebuild -scheme AlgoKitUtils-Package test -destination "${{ steps.ios_sim.outputs.destination }}"
      - name: Test (macOS)
        run: cd packages/swift/AlgoKitUtils && xcodebuild -scheme AlgoKitUtils-Package test -destination "platform=macOS"
      - name: Test (Catalyst)
        run: cd packages/swift/AlgoKitUtils && xcodebuild -scheme AlgoKitUtils-Package test -destination "platform=macOS,variant=Mac Catalyst"

      - name: Zip Swift package
        run: cd packages/swift && zip -r AlgoKitUtils.zip AlgoKitUtils -x "AlgoKitUtils/.build/*"

      - name: Upload Swift package artifact
        uses: actions/upload-artifact@v7
        with:
          name: AlgoKitUtils
          path: packages/swift/AlgoKitUtils.zip
