name: Swift (Distro) Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (must already exist, e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      SWIFT_DISTRO_REPOSITORY: algorandecosystem/algokit-core-swift
      SWIFT_DISTRO_DIR: swift-distro
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.BOT_ID }}
          private-key: ${{ secrets.BOT_SK }}
          owner: algorandecosystem
          repositories: algokit-core-swift

      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0
          targets: aarch64-apple-ios, x86_64-apple-ios, aarch64-apple-ios-sim, aarch64-apple-ios-macabi, x86_64-apple-ios-macabi, aarch64-apple-darwin, x86_64-apple-darwin

      - name: Build xcframeworks
        run: |
          cargo pkg transact swift
          cargo pkg crypto swift
          cargo pkg composer swift

      - name: Zip xcframeworks
        working-directory: packages/swift/AlgoKitUtils/Frameworks
        run: |
          zip -r algokit_transact.xcframework.zip algokit_transact.xcframework
          zip -r algokit_crypto.xcframework.zip   algokit_crypto.xcframework
          zip -r algokit_composer.xcframework.zip algokit_composer.xcframework

      - name: Compute SwiftPM checksums
        id: checksums
        working-directory: packages/swift/AlgoKitUtils
        run: |
          TRANSACT_SHA=$(swift package compute-checksum Frameworks/algokit_transact.xcframework.zip)
          CRYPTO_SHA=$(swift package compute-checksum   Frameworks/algokit_crypto.xcframework.zip)
          COMPOSER_SHA=$(swift package compute-checksum Frameworks/algokit_composer.xcframework.zip)
          echo "transact=$TRANSACT_SHA" >> "$GITHUB_OUTPUT"
          echo "crypto=$CRYPTO_SHA"     >> "$GITHUB_OUTPUT"
          echo "composer=$COMPOSER_SHA" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release in Swift distro repository
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh release create "$TAG" \
            packages/swift/AlgoKitUtils/Frameworks/algokit_transact.xcframework.zip \
            packages/swift/AlgoKitUtils/Frameworks/algokit_crypto.xcframework.zip \
            packages/swift/AlgoKitUtils/Frameworks/algokit_composer.xcframework.zip \
            --repo "$SWIFT_DISTRO_REPOSITORY" \
            --title "$TAG" \
            --generate-notes

      - name: Checkout Swift distro repository
        uses: actions/checkout@v6
        with:
          repository: ${{ env.SWIFT_DISTRO_REPOSITORY }}
          token: ${{ steps.app-token.outputs.token }}
          path: ${{ env.SWIFT_DISTRO_DIR }}
          fetch-depth: 0

      - name: Sync Swift package manifest, sources, and tests into distro repository
        run: |
          cp packages/swift/AlgoKitUtils/Package.swift "$SWIFT_DISTRO_DIR/Package.swift"
          rsync -a --delete packages/swift/AlgoKitUtils/Sources/ "$SWIFT_DISTRO_DIR/Sources/"
          rsync -a --delete packages/swift/AlgoKitUtils/Tests/ "$SWIFT_DISTRO_DIR/Tests/"

      - name: Rewrite distro Package.swift binary targets to remote URLs
        env:
          RELEASE_BASE: ${{ github.server_url }}/${{ env.SWIFT_DISTRO_REPOSITORY }}/releases/download/${{ env.TAG }}
          CHECKSUMS_JSON: |
            {
              "algokit_transact": "${{ steps.checksums.outputs.transact }}",
              "algokit_crypto":   "${{ steps.checksums.outputs.crypto }}",
              "algokit_composer": "${{ steps.checksums.outputs.composer }}"
            }
        run: |
          python3 - <<'PY'
          import json, os, re, sys

          path = os.path.join(os.environ["SWIFT_DISTRO_DIR"], "Package.swift")
          base = os.environ["RELEASE_BASE"]
          checksums = json.loads(os.environ["CHECKSUMS_JSON"])
          src = open(path).read()

          # Match a .binaryTarget(...) block with path: "Frameworks/<stem>.xcframework".
          # Tolerates trailing commas after the path argument and indentation drift.
          pattern = re.compile(
              r'(?P<indent> *)\.binaryTarget\(\s*'
              r'name:\s*"(?P<name>[^"]+)",\s*'
              r'path:\s*"Frameworks/(?P<stem>[^"/]+)\.xcframework"\s*,?\s*\)'
          )

          rewritten = []

          def replace(m):
              indent, name, stem = m["indent"], m["name"], m["stem"]
              if stem not in checksums:
                  sys.exit(
                      f"no checksum for xcframework '{stem}' (target '{name}'); "
                      f"add it to CHECKSUMS_JSON in the workflow"
                  )
              sha = checksums[stem]
              if not re.fullmatch(r"[0-9a-f]{64}", sha):
                  sys.exit(f"checksum for '{stem}' is malformed: {sha!r}")
              rewritten.append(name)
              inner = indent + "  "
              return (
                  f'{indent}.binaryTarget(\n'
                  f'{inner}name: "{name}",\n'
                  f'{inner}url: "{base}/{stem}.xcframework.zip",\n'
                  f'{inner}checksum: "{sha}"\n'
                  f'{indent})'
              )

          new_src, count = pattern.subn(replace, src)
          if count == 0:
              sys.exit("no path-form .binaryTarget blocks found in Package.swift")
          if re.search(r'path:\s*"Frameworks/', new_src):
              sys.exit("a path-form .binaryTarget was not rewritten; check Package.swift formatting")

          open(path, "w").write(new_src)
          print(f"rewrote {count} binary target(s): {', '.join(rewritten)}")
          PY

      - name: Validate rewritten distro Package.swift parses
        working-directory: ${{ env.SWIFT_DISTRO_DIR }}
        run: swift package describe > /dev/null

      - name: Update distro main and tag
        working-directory: ${{ env.SWIFT_DISTRO_DIR }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout main
          git pull --ff-only origin main
          git add Package.swift Sources Tests
          git commit -m "release($TAG): update Swift distro package"
          # Move the tag to this main commit so SwiftPM consumers resolve the rewritten manifest.
          git tag -f "$TAG"
          git push origin main
          git push origin "$TAG" --force
