[project]
requires-python = ">=3.9,<4.0"
name = "algokit_composer"
version = "0.1.0"

[build-system]
requires = ["poetry-core>=1.0.0", "setuptools", "wheel"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "algokit_composer"
version = "0.1.0"
description = ""
packages = [
    { include = "algokit_composer" }
]
include = [
    { path = "algokit_composer/*.so", format = "wheel" },
    { path = "algokit_composer/*.dll", format = "wheel" },
    { path = "algokit_composer/*.dylib", format = "wheel" },
    { path = "algokit_composer/algokit_composer_ffi.py", format = "wheel" }
]

[tool.poetry.dependencies]
[tool.pytest.ini_options]
markers = [
  "group_composer_tests",
  "group_simulate_tests",
]

[tool.poetry.group.test.dependencies]
algokit_transact = { path = "../algokit_transact", develop = true }
msgpack = ">=1.0.0,<2.0.0"
pynacl = ">=1.5.0,<2.0.0"
pytest = ">=7.4.4"

[tool.poetry.group.build.dependencies]
auditwheel = "^6.4.0"
patchelf = { version = "^0.17.2.2", markers = "sys_platform == 'linux'" }